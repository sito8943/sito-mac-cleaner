[package]
name = "sito-mac-cleaner"
version = "0.2.0"
description = "Limpieza de disco de macOS con disk-clean, desde la barra de menús"
authors = ["sito8943"]
edition = "2021"

[lib]
name = "sito_mac_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
